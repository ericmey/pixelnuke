# Raspberry Pi Debug Probe interface configuration
#
# The Debug Probe uses the CMSIS-DAP protocol and supports both
# JTAG and SWD transports. For Pi Zero 2 W, we use SWD.
#
# Connections to Pi Zero 2 W:
#   Debug Probe      Pi Zero 2 W Header
#   -----------      ------------------
#   SWCLK       -->  GPIO25 (pin 22)
#   SWDIO       -->  GPIO24 (pin 18) or GPIO27 (pin 13)
#   GND         -->  GND (pin 6, 9, 14, 20, 25, 30, 34, 39)
#
# UART connections (optional, for serial bootloader):
#   UART TX     -->  GPIO15 (pin 10, RX)
#   UART RX     -->  GPIO14 (pin 8, TX)
#   GND         -->  GND

adapter driver cmsis-dap

# Use SWD transport (more reliable than JTAG for Pi)
transport select swd

# Start with conservative speed, can increase after connection
adapter speed 1000

# The Debug Probe should be found automatically, but you can
# specify serial number if you have multiple probes:
# cmsis_dap_serial E6614103E72C5B29
