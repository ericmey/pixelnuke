# Broadcom BCM2710A1 (Raspberry Pi Zero 2 W) / BCM2837 (Raspberry Pi 3)
# Quad-core ARM Cortex-A53 (ARMv8-A)
#
# The BCM2710A1 is a cut-down BCM2837, both use the same debug interface.
# DAP ID: 0x4ba00477 (ARM Debug Access Port v2)
#
# Documentation:
#   https://www.raspberrypi.com/documentation/computers/processors.html
#
# Debug base addresses obtained via 'dap info' command:
#   Core 0: DBG 0x80010000, CTI 0x80018000
#   Core 1: DBG 0x80012000, CTI 0x8001a000
#   Core 2: DBG 0x80014000, CTI 0x8001c000
#   Core 3: DBG 0x80016000, CTI 0x8001e000

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME bcm2710
}

if { [info exists CHIPCORES] } {
	set _cores $CHIPCORES
} else {
	set _cores 4
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x4ba00477
}

# Create DAP - for SWD this is done via swd newdap, for JTAG via jtag newtap
if { [using_jtag] } {
	jtag newtap $_CHIPNAME cpu -expected-id $_DAP_TAPID -irlen 4
} else {
	swd newdap $_CHIPNAME cpu -expected-id $_DAP_TAPID
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# MEM-AP for direct memory access
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0

# Debug base addresses for BCM2710/BCM2837
# These differ from BCM2711 (Pi 4)
set _DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set _CTIBASE {0x80018000 0x8001a000 0x8001c000 0x8001e000}

set _smp_command "target smp"

for { set _core 0 } { $_core < $_cores } { incr _core } {
	set _CTINAME $_CHIPNAME.cti$_core
	set _TARGETNAME $_CHIPNAME.cpu$_core

	cti create $_CTINAME -dap $_CHIPNAME.dap -ap-num 0 \
		-baseaddr [lindex $_CTIBASE $_core]

	# Use aarch64 target type for Cortex-A53
	target create $_TARGETNAME aarch64 -dap $_CHIPNAME.dap -ap-num 0 \
		-dbgbase [lindex $_DBGBASE $_core] -cti $_CTINAME

	set _smp_command "$_smp_command $_TARGETNAME"
}

# Enable SMP debugging by default for multi-core debug
if { [info exists USE_SMP] && $_USE_SMP } {
	eval $_smp_command
}

# Default target is cpu0
targets $_CHIPNAME.cpu0
