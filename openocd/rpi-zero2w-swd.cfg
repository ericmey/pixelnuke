# Pi Zero 2 W OpenOCD configuration (SWD mode)
# BCM2710A1 - Cortex-A53 quad-core (ARMv8)

adapter driver cmsis-dap
transport select swd
adapter speed 100

# Try with reset
adapter srst delay 100
reset_config srst_only srst_nogate

set _CHIPNAME bcm2710
set _DAP_TAPID 0x4ba00477

swd newdap $_CHIPNAME cpu -expected-id $_DAP_TAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Just try mem_ap first
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0
