adapter driver cmsis-dap
transport select jtag
adapter speed 1000

set _CHIPNAME bcm2710
set _DAP_TAPID 0x4ba00477

jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.cpu.0 cortex_a -dap $_CHIPNAME.dap -coreid 0
target create $_CHIPNAME.cpu.1 cortex_a -dap $_CHIPNAME.dap -coreid 1
target create $_CHIPNAME.cpu.2 cortex_a -dap $_CHIPNAME.dap -coreid 2
target create $_CHIPNAME.cpu.3 cortex_a -dap $_CHIPNAME.dap -coreid 3