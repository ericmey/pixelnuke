# OpenOCD configuration for Pi Zero 2 W with Raspberry Pi Debug Probe
#
# Usage:
#   openocd -f openocd/rpi-debug-probe.cfg
#
# Then connect with GDB:
#   arm-none-eabi-gdb -ex "target extended-remote :3333" kernel8-32.elf
#
# Or use telnet for OpenOCD commands:
#   telnet localhost 4444

source [find openocd/interface/raspberrypi-debug-probe.cfg]
source [find openocd/board/rpi-zero2w.cfg]

# Increase speed after successful connection
adapter speed 4000
