# Raspberry Pi Zero 2 W board configuration
#
# The Pi Zero 2 W uses the BCM2710A1 chip (quad-core Cortex-A53).
# This is a cut-down version of the BCM2837 used in Pi 3.
#
# SWD Pins (directly accessible without enable_jtag_gpio):
#   SWCLK: GPIO25 (pin 22)
#   SWDIO: GPIO24 (pin 18) or GPIO27 (pin 13)
#
# Note: Unlike JTAG, SWD doesn't require config.txt modification.
# The debug interface is always available.
#
# Usage with Raspberry Pi Debug Probe:
#   openocd -f interface/raspberrypi-debug-probe.cfg -f board/rpi-zero2w.cfg
#
# Usage with other CMSIS-DAP adapters:
#   openocd -f interface/cmsis-dap.cfg -c "transport select swd" -f board/rpi-zero2w.cfg

# Include the BCM2710 target definition
source [find target/bcm2710.cfg]

# Pi Zero 2 W has no SRST pin exposed, only TRST-like behavior via SWD
# The processor can be reset via debug registers
reset_config none

# Event handlers for common operations
$_CHIPNAME.cpu0 configure -event reset-assert-post {
	# After reset, CPU starts at reset vector
	# For bare metal, this is typically 0x8000 or 0x80000
}

$_CHIPNAME.cpu0 configure -event gdb-detach {
	# Resume execution when GDB detaches
	resume
}
