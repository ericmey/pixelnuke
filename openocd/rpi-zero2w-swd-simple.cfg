# Pi Zero 2 W - Minimal SWD config for debugging connection issues

adapter driver cmsis-dap
transport select swd
adapter speed 1000

# Connect to the DAP
swd newdap bcm2710 cpu -expected-id 0x4ba00477
dap create bcm2710.dap -chain-position bcm2710.cpu

# Minimal target - just mem_ap for now
target create bcm2710.ap mem_ap -dap bcm2710.dap -ap-num 0
